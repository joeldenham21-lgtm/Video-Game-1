<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>weapon viewer</title>
<style>html,body{margin:0;background:#3a3f46;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "../../vendor/three.module.js" } }</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from '../vendor/addons/environments/RoomEnvironment.js';
import { buildAR15 } from '../src/weapons/ar15.js';
import { buildPistol } from '../src/weapons/pistol.js';
import { buildBoltRifle } from '../src/weapons/bolt.js';
import { mat } from '../src/materials.js';

const q = new URLSearchParams(location.search);
const which = q.get('w') || 'ar15';
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x3a3f46);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const sun = new THREE.DirectionalLight(0xfff2e0, 2.2); sun.position.set(1.5, 2.5, 1.2); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.camera.near = 0.1; sun.shadow.camera.far = 10;
sun.shadow.camera.left = sun.shadow.camera.bottom = -1; sun.shadow.camera.right = sun.shadow.camera.top = 1; sun.shadow.bias = -0.0002; sun.shadow.normalBias = 0.002;
scene.add(sun, new THREE.HemisphereLight(0xcfd8e6, 0x3a3630, 0.6));
const floor = new THREE.Mesh(new THREE.PlaneGeometry(4, 4), new THREE.MeshStandardMaterial({ color: 0x555a60, roughness: 0.9 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = -0.25; floor.receiveShadow = true; scene.add(floor);

const weapon = which === 'pistol' ? buildPistol() : which === 'bolt' ? buildBoltRifle() : buildAR15();
scene.add(weapon.group);
// reticle / ocular placeholders (optics.js assigns real shaders in the game)
const ret = weapon.parts.reticle?.obj || weapon.parts.scope?.ocular; if (ret) ret.material = new THREE.MeshStandardMaterial({ color: 0x0a2030, roughness: 0.05, metalness: 0.3 });
if (q.get('action')) weapon.setActionPos(parseFloat(q.get('action')));
if (q.get('bolt')) weapon.setBolt?.(1, parseFloat(q.get('bolt')));
if (q.get('dust')) weapon.setDustCover(1);
if (q.get('trigger')) weapon.setTrigger(parseFloat(q.get('trigger')));
if (q.get('mode')) weapon.setSelector(q.get('mode'));
if (q.get('magout')) { weapon.setMagOffset(new THREE.Vector3(0, -0.12, 0.03), new THREE.Vector3(0.3, 0, 0.2)); }

const box = new THREE.Box3().setFromObject(weapon.group); const size = box.getSize(new THREE.Vector3()); const center = box.getCenter(new THREE.Vector3());
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 50);
const views = {
  side: { pos: [-1, 0.15, 0], dist: 1.0 }, side_r: { pos: [1, 0.12, 0], dist: 1.0 }, top: { pos: [0, 1, 0.001], dist: 1.0 },
  q34: { pos: [-0.8, 0.5, -0.9], dist: 1.0 }, rear: { pos: [0.3, 0.35, 1.2], dist: 0.8 }, front: { pos: [0.5, 0.3, -1.2], dist: 0.8 },
  port: { pos: [1, 0.35, -0.2], dist: 0.32, look: [0.02, 0.0, -0.12] }, grip: { pos: [0.8, -0.2, 0.7], dist: 0.35, look: [0, -0.07, 0] },
  muzzle: { pos: [0.8, 0.4, -1], dist: 0.3, look: 'muzzle' }, optic: { pos: [-0.7, 0.6, 0.8], dist: 0.35, look: 'sight' },
  ads: { pos: [0, 0, 1], dist: 0, look: 'ads' },
  portR: { pos: [1, 0.05, 0], dist: 0.22, look: [0.02, 0.0, -0.124] }, portRb: { pos: [1, 0.05, 0], dist: 0.22, look: [0.02, 0.0, -0.02] },
  slideTop: { pos: [0.3, 1, -0.2], dist: 0.25, look: [0, 0.01, -0.02] },
};
window.snap = (name) => {
  const v = views[name];
  let look = center.clone();
  if (Array.isArray(v.look)) look.set(...v.look);
  else if (v.look === 'muzzle') look.copy(weapon.anchors.muzzle);
  else if (v.look === 'sight') look.set(0, weapon.anchors.sightAxis.y, weapon.anchors.sightAxis.z);
  const maxDim = Math.max(size.x, size.y, size.z);
  const dist = v.dist * (v.look ? 1 : maxDim * 1.25);
  if (v.look === 'ads') { camera.position.set(0, weapon.anchors.sightAxis.y, weapon.anchors.eyeZ); camera.lookAt(0, weapon.anchors.sightAxis.y, -100); camera.fov = 30; }
  else { camera.position.copy(look).add(new THREE.Vector3(...v.pos).normalize().multiplyScalar(dist)); camera.lookAt(look); camera.fov = 35; }
  camera.updateProjectionMatrix();
  renderer.render(scene, camera);
  return { size: size.toArray().map(n => +n.toFixed(3)), center: center.toArray().map(n => +n.toFixed(3)), tris: renderer.info.render.triangles, calls: renderer.info.render.calls };
};
window.ready = true;
</script></body></html>
