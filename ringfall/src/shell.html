<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#04060b">
<title>RINGFALL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Share+Tech+Mono&display=swap">
<style>
:root {
  color-scheme: dark;
  --void: #04060b;
  --panel: rgba(8, 12, 20, 0.72);
  --panel-solid: #0a0f18;
  --line: rgba(160, 220, 255, 0.22);
  --text: #e6f1ff;
  --muted: #8ea3b8;
  --signal: #7fe6ff;
  --signal-dim: rgba(127, 230, 255, 0.35);
  --amber: #ffb547;
  --danger: #ff3b5c;
  --heal: #5dffa8;
  --gold: #ffd257;
  --violet: #b98cff;
  --display: 'Chakra Petch', 'Segoe UI', system-ui, sans-serif;
  --mono: 'Share Tech Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%; overflow: hidden; background: var(--void); color: var(--text);
  font-family: var(--display); overscroll-behavior: none; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none; -webkit-text-size-adjust: 100%;
}
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
#ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
#touch { position: fixed; inset: 0; z-index: 20; display: none; touch-action: none; }
#touch.active { display: block; }
button { font-family: var(--display); }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

/* ---------- boot splash ---------- */
#boot { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; background: var(--void); transition: opacity .6s ease; }
#boot.gone { opacity: 0; pointer-events: none; }
#boot .mark { font-weight: 700; letter-spacing: .5em; font-size: 14px; color: var(--muted); text-indent: .5em; }
#boot .bar { width: 160px; height: 2px; background: rgba(255,255,255,.08); margin: 14px auto 0; overflow: hidden; }
#boot .bar i { display: block; height: 100%; width: 30%; background: var(--signal); animation: bootbar 1.1s ease-in-out infinite; }
@keyframes bootbar { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }
#boot .err { max-width: 420px; padding: 0 20px; margin-top: 18px; color: var(--danger); font-family: var(--mono); font-size: 13px; text-align: center; }
</style>
</head>
<body>
<canvas id="game" tabindex="-1"></canvas>
<div id="ui"></div>
<div id="touch"></div>
<div id="boot"><div><div class="mark">RINGFALL</div><div class="bar"><i></i></div><div class="err" id="boot-err" hidden></div></div></div>
<!--GAME_SCRIPT-->
</body>
</html>
